
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d2b">
<title>Bubble Night 🫧</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 100%, #182c61 0%, transparent 55%),
    linear-gradient(180deg, #050817, #10153b 65%, #080d2b);
  color: white;
  font-family: system-ui, sans-serif;
  touch-action: manipulation;
}

#sky {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 6px #b8d9ff;
  animation: twinkle var(--twinkle) ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.5); }
}

.title {
  position: absolute;
  top: 10%;
  width: 100%;
  text-align: center;
  z-index: 2;
  pointer-events: none;
}

.title h1 {
  font-size: clamp(25px, 7vw, 36px);
  letter-spacing: 2px;
  text-shadow: 0 0 18px #88caff;
}

.title p {
  margin-top: 10px;
  color: #c6d8ff;
  font-size: 13px;
  letter-spacing: 1px;
}

.bubble {
  position: absolute;
  bottom: -100px;
  border-radius: 50%;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(circle at 28% 24%,
      rgba(255,255,255,.9) 0 2%,
      rgba(255,255,255,.35) 5%,
      transparent 17%),
    radial-gradient(circle at 70% 75%,
      rgba(116,88,255,.13),
      transparent 48%),
    radial-gradient(circle at 35% 35%,
      rgba(255,255,255,.1),
      rgba(94,218,255,.03) 55%,
      rgba(255,144,239,.18));
  border: 1px solid rgba(190,232,255,.72);
  box-shadow:
    inset -5px -7px 14px rgba(115,134,255,.15),
    inset 4px 4px 10px rgba(255,255,255,.16),
    0 0 12px rgba(100,199,255,.22);
  animation: floatUp var(--duration) linear forwards;
  z-index: 1;
  will-change: transform, opacity;
}

.bubble::before {
  content: "";
  position: absolute;
  width: 22%;
  height: 10%;
  top: 17%;
  left: 20%;
  border-radius: 50%;
  background: rgba(255,255,255,.9);
  filter: blur(1px);
  transform: rotate(-35deg);
}

.bubble::after {
  content: "";
  position: absolute;
  width: 9%;
  height: 9%;
  top: 29%;
  left: 15%;
  border-radius: 50%;
  background: rgba(255,255,255,.7);
}

@keyframes floatUp {
  0% {
    transform: translate3d(0, 0, 0) scale(.8);
    opacity: 0;
  }
  8% { opacity: .9; }
  25% { transform: translate3d(15px, -25vh, 0) scale(1); }
  50% { transform: translate3d(-15px, -50vh, 0) scale(.95); }
  75% { transform: translate3d(12px, -75vh, 0) scale(1.05); }
  90% { opacity: .8; }
  100% {
    transform: translate3d(-8px, -115vh, 0) scale(.9);
    opacity: 0;
  }
}

.bubble.popping {
  animation: pop .18s ease-out forwards !important;
  pointer-events: none;
}

@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  45% { transform: scale(1.3); opacity: .8; }
  100% { transform: scale(1.8); opacity: 0; }
}

.spark {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #d8f7ff;
  box-shadow: 0 0 10px #8de7ff;
  pointer-events: none;
  animation: sparkle .45s ease-out forwards;
  z-index: 3;
}

@keyframes sparkle {
  to {
    transform: translate(var(--x), var(--y)) scale(0);
    opacity: 0;
  }
}

.hint {
  position: absolute;
  bottom: 7%;
  width: 100%;
  text-align: center;
  color: #c5d8ff;
  font-size: 12px;
  letter-spacing: 1px;
  opacity: .85;
  pointer-events: none;
}

button {
  position: absolute;
  bottom: 12%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  padding: 12px 23px;
  border: 1px solid rgba(191,226,255,.65);
  border-radius: 30px;
  background: rgba(112,150,255,.15);
  color: white;
  font-size: 14px;
  backdrop-filter: blur(8px);
  box-shadow: 0 0 18px rgba(110,180,255,.15);
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  background: rgba(112,150,255,.4);
}

#sky.paused .bubble {
  animation-play-state: paused;
}
</style>
</head>

<body>
<div id="sky">
  <div class="title">
    <h1>Bubble Night 🫧</h1>
    <p>sentuh gelembungnya ✨</p>
  </div>

  <button id="toggle">❚❚ jeda gelembung</button>
  <div class="hint">tap bubble • listen to the pop</div>
</div>

<script>
const sky = document.getElementById("sky");
const toggle = document.getElementById("toggle");

let paused = false;
let audioCtx = null;
let spawnTimer = null;

// Bintang di langit
for (let i = 0; i < 85; i++) {
  const star = document.createElement("i");
  star.className = "star";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.setProperty(
    "--twinkle",
    (1.5 + Math.random() * 3) + "s"
  );
  sky.appendChild(star);
}

// Audio dibuat langsung oleh browser, tanpa file suara
function playPop() {
  try {
    const AudioContext =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContext) return;

    if (!audioCtx) audioCtx = new AudioContext();

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    const now = audioCtx.currentTime;
    const duration = 0.12;

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(850, now);
    oscillator.frequency.exponentialRampToValueAtTime(
      180, now + duration
    );

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(
      0.28, now + 0.008
    );
    gain.gain.exponentialRampToValueAtTime(
      0.0001, now + duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);
    oscillator.start(now);
    oscillator.stop(now + duration);
  } catch (error) {
    console.log("Audio belum tersedia", error);
  }
}

function createSparkles(x, y) {
  for (let i = 0; i < 8; i++) {
    const spark = document.createElement("i");
    spark.className = "spark";

    spark.style.left = x + "px";
    spark.style.top = y + "px";

    const angle = Math.random() * Math.PI * 2;
    const distance = 15 + Math.random() * 35;

    spark.style.setProperty(
      "--x", Math.cos(angle) * distance + "px"
    );
    spark.style.setProperty(
      "--y", Math.sin(angle) * distance + "px"
    );

    sky.appendChild(spark);
    spark.addEventListener("animationend", () => spark.remove());
  }
}

function popBubble(bubble, event) {
  if (bubble.classList.contains("popping")) return;

  // Bangunkan audio saat ada sentuhan pengguna
  playPop();

  const rect = bubble.getBoundingClientRect();
  const x = event && event.clientX
    ? event.clientX : rect.left + rect.width / 2;
  const y = event && event.clientY
    ? event.clientY : rect.top + rect.height / 2;

  createSparkles(x, y);
  bubble.classList.add("popping");

  setTimeout(() => bubble.remove(), 200);
}

function createBubble() {
  if (paused) return;

  // Jaga jumlah gelembung tetap sedang
  if (sky.querySelectorAll(".bubble").length >= 14) return;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const size = 28 + Math.random() * 48;
  const duration = 7 + Math.random() * 6;

  bubble.style.width = size + "px";
  bubble.style.height = size + "px";
  bubble.style.left =
    (Math.random() * (window.innerWidth - size)) + "px";

  bubble.style.setProperty("--duration", duration + "s");

  sky.appendChild(bubble);

  bubble.addEventListener("pointerdown", event => {
    event.preventDefault();
    popBubble(bubble, event);
  });

  bubble.addEventListener("animationend", event => {
    if (event.animationName === "floatUp") bubble.remove();
  });
}

function startBubbles() {
  clearInterval(spawnTimer);
  spawnTimer = setInterval(createBubble, 550);
}

toggle.addEventListener("click", () => {
  paused = !paused;
  sky.classList.toggle("paused", paused);

  toggle.textContent = paused
    ? "▶ lanjutkan gelembung"
    : "❚❚ jeda gelembung";

  if (!paused) createBubble();
});

startBubbles();

// Beberapa gelembung langsung muncul saat halaman dibuka
for (let i = 0; i < 8; i++) {
  setTimeout(createBubble, i * 250);
}
</script>
</body>
</html>
